[alphabetical-app-grid]
folder-order-position='end'

[blur-my-shell]
rounded-blur-found=false
settings-version=2

[blur-my-shell/appfolder]
blur=false
brightness=0.59999999999999998
sigma=30

[blur-my-shell/coverflow-alt-tab]
pipeline='pipeline_default'

[blur-my-shell/dash-to-dock]
blur=true
brightness=0.59999999999999998
pipeline='pipeline_default_rounded'
sigma=30
static-blur=true
style-dash-to-dock=0

[blur-my-shell/hidetopbar]
compatibility=false

[blur-my-shell/lockscreen]
blur=false
pipeline='pipeline_default'

[blur-my-shell/overview]
blur=true
pipeline='pipeline_default'

[blur-my-shell/panel]
blur=false
brightness=0.59999999999999998
pipeline='pipeline_default'
sigma=30

[blur-my-shell/screenshot]
blur=false
pipeline='pipeline_default'

[blur-my-shell/window-list]
blur=false
brightness=0.59999999999999998
sigma=30

[clipboard-history]
private-mode=false

[dash-to-dock]
background-opacity=0.80000000000000004
dash-max-icon-size=40
dock-fixed=false
dock-position='LEFT'
height-fraction=0.90000000000000002
isolate-workspaces=false
preferred-monitor=-2
preferred-monitor-by-connector='eDP-1'

[ding]
check-x11wayland=true

[inputmethod-shortcuts]
imkey-1=@as []
imkey-2=@as []
imkey-3=@as []
imkey-4=@as []
imkey-5=@as []
imkey-6=@as []
imkey-7=@as []
imkey-8=@as []
imkey-9=@as []
tpkey-2=['<Control>m']

[just-perfection]
accessibility-menu=true
animation=0
background-menu=true
controls-manager-spacing-size=0
dash=true
dash-app-running=true
dash-icon-size=0
double-super-to-appgrid=true
max-displayed-search-results=0
notification-banner-position=1
osd=true
panel=true
panel-in-overview=true
ripple-box=true
search=true
show-apps-button=true
startup-status=1
support-notifier-showed-version=34
support-notifier-type=0
theme=false
top-panel-position=1
window-demands-attention-focus=false
window-maximized-on-create=false
window-picker-icon=true
window-preview-caption=true
window-preview-close-button=true
workspace=true
workspace-background-corner-size=0
workspace-popup=true
workspace-switcher-should-show=false
workspaces-in-app-grid=true

[space-bar/appearance]
application-styles='.space-bar {\n  -natural-hpadding: 12px;\n}\n\n.space-bar-workspace-label.active {\n  margin: 0 4px;\n  background-color: rgba(255,255,255,0.3);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive.empty {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,0.5);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}'

[space-bar/behavior]
always-show-numbers=false
smart-workspace-names=false

[space-bar/shortcuts]
enable-activate-workspace-shortcuts=false
enable-move-to-workspace-shortcuts=true
open-menu=@as []

[space-bar/state]
version=34

[tactile]
col-0=1
col-1=2
col-2=1
col-3=0
gap-size=32
row-0=1
row-1=1

[tiling-assistant]
active-window-hint-color='rgb(211,70,21)'
last-version-installed=46
tiling-popup-all-workspace=true

[tophat]
cpu-display='both'
fs-display='both'
mem-display='numeric'
meter-fg-color='rgb(97,53,131)'
mount-to-monitor='/'
network-usage-unit='bytes'
refresh-rate='slow'
show-cpu=true
show-disk=false
show-icons=false
show-mem=true
show-menu-actions=false
